name: Unpack Kairo source archive

on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "kairo-client.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o zip na branch atual
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          archive = Path("kairo-client.zip")
          if not archive.is_file():
              raise SystemExit("kairo-client.zip nao encontrado")
          temp = Path("_kairo_unpack")
          shutil.rmtree(temp, ignore_errors=True)
          temp.mkdir()
          with ZipFile(archive) as z:
              for i in z.infolist():
                  p = Path(i.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit("Caminho inseguro: " + i.filename)
              z.extractall(temp)
          entries = list(temp.iterdir())
          source = entries[0] if len(entries) == 1 and entries[0].is_dir() else temp
          # remove codigo antigo para nao sobrar classes apagadas
          shutil.rmtree("src", ignore_errors=True)
          shutil.rmtree("installer", ignore_errors=True)
          for item in source.iterdir():
              if item.name in {".git", ".github"}:
                  continue
              t = Path(item.name)
              if item.is_dir():
                  shutil.copytree(item, t, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, t)
          shutil.rmtree(temp)
          PY

      - name: Commit na branch atual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: unpack Kairo client source archive" && git push)
