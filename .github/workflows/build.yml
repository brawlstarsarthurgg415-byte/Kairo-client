name: Build Kairo Client

on:
  push:
    branches: [main, "dev/**", "compat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Compilar e testar
        run: gradle --no-daemon clean build --stacktrace 2>&1 | tee build.log
        shell: bash

      - name: Gerar Kairo-Fabric.jar e Kairo-Battly.mrpack
        run: python3 scripts/package.py

      - name: Validar pacotes (metadados, mixins, mrpack)
        run: python3 scripts/validate.py

      - uses: actions/upload-artifact@v4
        with:
          name: Kairo-Battly-${{ github.run_number }}
          path: |
            dist/Kairo-Battly.mrpack
            dist/Kairo-Fabric.jar
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Logs em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            build.log
            build/reports/**
            build/test-results/**

      - name: Publicar Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Kairo-Battly.mrpack
            dist/Kairo-Fabric.jar
            dist/SHA256SUMS.txt
